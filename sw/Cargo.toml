[workspace]
members = [
    "crates/lc3-asm",
    "crates/lc3-cli",
    "crates/lc3-image",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
