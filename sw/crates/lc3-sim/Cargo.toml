[package]
name = "lc3-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
lc3-image = { path = "../lc3-image" }

[features]
default = []
verilator = ["dep:cc"]

[build-dependencies]
cc = { version = "1.4.4", optional = true }
